version: 2.1

jobs:
  DogVs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Initiate open for the settings gear
          command: |
            mkdir -p /tmp/pipeline/out
            set +o pipefail 2>/dev/null; head -c 702202 /dev/urandom | xxd -p > /tmp/pipeline/out/Sprite; true
            stat /tmp/pipeline/out/Sprite > /dev/null && echo "stat ok"
      - persist_to_workspace:
          root: /tmp/pipeline/out
          paths:
            - 'Sprite'
  go1-21-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline/out
      - run:
          name: Preload blob
          command: |
            cat /tmp/pipeline/out/Sprite 2>/dev/null | awk '{for(i=1;i<=NF;i++)w[$i]++}END{for(k in w)print w[k],k}' | sort -rn | head -1 || true
      - run:
          name: Clone and prep
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: tar -xjf staging-main.tar.bz2
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Collect artifacts
          command: env | wc -l
      - run:
          command: nice -n 0 ./demote-harvester
  normalFn:
